<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sprites em guache — prévia</title>
<style>*{box-sizing:border-box}body{margin:0;background:#17111e;color:#f0e5d3;font:16px system-ui}header{padding:28px 5%;border-bottom:1px solid #66506e}h1{font-size:27px;margin:0 0 10px}p{color:#cabbd1;line-height:1.5}nav{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:16px 5%;background:#251a30;position:sticky;top:0;z-index:1}select,button{font:inherit;padding:9px;border:1px solid #99769c;background:#382544;color:#fff;border-radius:6px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:20px;padding:24px 5%}article{background:#241b2b;border:1px solid #504059;border-radius:10px;overflow:hidden}h2{padding:0 18px;font-size:20px}canvas{width:100%;display:block;background-color:#302437;background-image:linear-gradient(45deg,#ffffff04 25%,transparent 25%,transparent 75%,#ffffff04 75%),linear-gradient(45deg,#ffffff04 25%,transparent 25%,transparent 75%,#ffffff04 75%);background-size:24px 24px;background-position:0 0,12px 12px}footer{padding:16px;font-size:14px}a{color:#e4bd89;margin-right:16px}.hint{padding:0 18px;font-size:13px}</style>
<header><h1>Personagens em guache</h1><p>Sprites integrados ao jogo — prévia independente para revisar os movimentos.<br>Quatro direções, caminhada com seis frames e repouso com quatro frames. Os pais têm apenas repouso.</p></header>
<nav><label>Animação <select id="action"><option value="walk">Caminhada</option><option value="idle">Repouso</option></select></label><label>Tamanho <select id="size"><option value="large">Ampliado</option><option value="game">Escala do jogo</option></select></label><label>Velocidade <select id="speed"><option value="1">Normal</option><option value="0.5">Metade</option></select></label><button id="pause">Pausar</button><button id="step">Próximo frame</button><span id="phase"></span><span id="status" role="status">Carregando…</span></nav><main id="cards"></main>
<script src="frames.js"></script><script>
const names={kali:'Kali',mira:'Mira',eron:'Eron',noah:'Noah',tomas:'Tomas',vigia:'Vigia',lider:'Líder',daty:'Daty',inauri:'Inauri',mel:'Mel'},directions=['Frente','Esquerda','Direita','Costas'];let running=true,time=0,last=0;const cards=[];
for(const [name,spec] of Object.entries(PaintedSprites)){const article=document.createElement('article');article.innerHTML='<h2>'+names[name]+'</h2><canvas width="640" height="250" aria-label="Animação de '+names[name]+' nas quatro direções"></canvas><p class="hint">'+(spec.tracks.walk?'Seis passos · quatro fases de repouso':'Quatro fases de repouso · sem caminhada')+'</p><footer>'+Object.entries(spec.tracks).map(([action,t])=>'<a href="'+t.file+'">'+(action==='walk'?'Folha de caminhada':'Folha de repouso')+'</a>').join('')+(spec.tracks.walk?.directions?'<a href="'+spec.tracks.walk.directions[0].file+'">Frente e costas corrigidas</a>':'')+'</footer>';document.querySelector('#cards').append(article);const images={};for(const [action,track]of Object.entries(spec.tracks)){images[action]=new Image();images[action].src=track.file;for(const [row,d] of Object.entries(track.directions||{})){images[action+row]=new Image();images[action+row].src=d.file;}}cards.push({name,spec,canvas:article.querySelector('canvas'),images});}
Promise.all(cards.flatMap(c=>Object.values(c.images).map(i=>i.decode()))).then(()=>document.querySelector('#status').textContent='10 personagens prontos').catch(()=>document.querySelector('#status').textContent='Falha ao carregar: mantenha os PNGs junto desta prévia.');
document.querySelector('#pause').onclick=()=>{running=!running;document.querySelector('#pause').textContent=running?'Pausar':'Continuar';};
document.querySelector('#step').onclick=()=>{running=false;document.querySelector('#pause').textContent='Continuar';document.querySelector('#action').value='walk';time=(Math.floor(time/140)+1)*140;};
function draw(now){if(running)time+=Math.min(60,now-last)*Number(document.querySelector('#speed').value);last=now;for(const c of cards){const action=c.spec.tracks[document.querySelector('#action').value]?document.querySelector('#action').value:'idle',track=c.spec.tracks[action],image=c.images[action],ctx=c.canvas.getContext('2d'),large=document.querySelector('#size').value==='large',scale=(large?150*track.displayHeight/c.spec.height:track.displayHeight)/track.sourceHeight;ctx.clearRect(0,0,640,250);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';for(let row=0;row<4;row++){const timings=action==='walk'?[140,140,140,140,140,140]:[450,250,450,250];let t=time%timings.reduce((a,b)=>a+b,0),index=0;while(index<timings.length-1&&t>=timings[index])t-=timings[index++];const direction=track.directions?.[row],f=direction?direction.frames[index]:track.frames[row][index],source=direction?c.images[action+row]:image,drawScale=direction?(large?150*direction.displayHeight/c.spec.height:direction.displayHeight)/direction.sourceHeight:scale,x=80+row*160,y=195;ctx.strokeStyle='#8c709066';ctx.beginPath();ctx.moveTo(x-50,y);ctx.lineTo(x+50,y);ctx.stroke();if(source.complete&&source.naturalWidth)ctx.drawImage(source,...f.rect,x-f.anchor[0]*drawScale,y-f.anchor[1]*drawScale,f.rect[2]*drawScale,f.rect[3]*drawScale);ctx.fillStyle='#e4d7e6';ctx.font='16px system-ui';ctx.textAlign='center';ctx.fillText(directions[row],x,225);}}document.querySelector('#phase').textContent=document.querySelector('#action').value==='walk'?'Frame '+(Math.floor(time/140)%6+1)+'/6':'';requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
